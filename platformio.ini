[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

; The default single_app layout caps the application at 1MB, which this build
; nearly fills once WiFi, HTTP and mDNS are in. See partitions.csv.
board_build.partitions = partitions.csv

; Board-level settings (flash size, UART console) live in sdkconfig.defaults -
; ESP-IDF is configured through Kconfig, not build_flags.
